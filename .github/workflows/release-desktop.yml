name: Release
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag matching package.json (for example v0.0.1)
        required: true
        default: v0.0.1
permissions:
  contents: write
concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false
jobs:
  draft:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Verify version
        env:
          TAG: ${{ inputs.tag || github.ref_name }}
        run: node -e 'const p=require("./package.json"); if(process.env.TAG!==`v${p.version}`) throw Error("Release tag must match package.json version")'
      - name: Create release draft
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          if gh release view "$TAG" --json isDraft --jq .isDraft >/tmp/dovo-release-draft 2>/dev/null; then
            test "$(cat /tmp/dovo-release-draft)" = true || { echo '::error::Release is already published'; exit 1; }
            gh release edit "$TAG" --target "$GITHUB_SHA"
          else
            gh release create "$TAG" --draft --title "Dovo Studio ${TAG#v}" --target "$GITHUB_SHA" --generate-notes
          fi
  mac:
    needs: draft
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: pnpm/action-setup@v4
      - name: Verify release version
        env:
          TAG: ${{ inputs.tag || github.ref_name }}
        run: node -e 'const p=require("./package.json"); if(process.env.TAG!==`v${p.version}`) throw Error("Tag must match package.json version")'
      - name: Verify Apple signing secrets
        env:
          MAC_CERTIFICATE: ${{ secrets.MAC_CERTIFICATE }}
          MAC_CERTIFICATE_PASSWORD: ${{ secrets.MAC_CERTIFICATE_PASSWORD }}
          MAC_SIGNING_IDENTITY: ${{ secrets.MAC_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          for name in MAC_CERTIFICATE MAC_CERTIFICATE_PASSWORD MAC_SIGNING_IDENTITY APPLE_ID APPLE_APP_SPECIFIC_PASSWORD APPLE_TEAM_ID; do
            test -n "${!name}" || { echo "::error::Missing $name secret"; exit 1; }
          done
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: Build signed update artifacts into a draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_LINK: ${{ secrets.MAC_CERTIFICATE }}
          CSC_KEY_PASSWORD: ${{ secrets.MAC_CERTIFICATE_PASSWORD }}
          CSC_NAME: ${{ secrets.MAC_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          GITHUB_REF_NAME: ${{ inputs.tag || github.ref_name }}
        run: node scripts/packaging/package-desktop.mjs --publish
      - name: Verify Mac signature and notarization
        run: |
          codesign --verify --deep --strict --verbose=2 "release/mac-arm64/Dovo Studio.app"
          spctl --assess --type execute --verbose=2 "release/mac-arm64/Dovo Studio.app"
          xcrun stapler validate "release/mac-arm64/Dovo Studio.app"
      - name: Upload mise desktop archive
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ inputs.tag || github.ref_name }}
        run: gh release upload "$TAG" release/Dovo-Studio-mise-*.tar.gz --clobber
  desktop:
    needs: draft
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-2025
            arch: x64
          - runner: windows-11-arm
            arch: arm64
          - runner: ubuntu-24.04
            arch: x64
          - runner: ubuntu-24.04-arm
            arch: arm64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      USE_SYSTEM_FPM: 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          architecture: ${{ matrix.arch }}
      - uses: pnpm/action-setup@v4
      - name: Verify native architecture
        env:
          EXPECTED_ARCH: ${{ matrix.arch }}
        run: node -e "if(process.arch!==process.env.EXPECTED_ARCH) throw Error('Native architecture mismatch')"
      - name: Install Linux packaging tools
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y rpm ruby-dev build-essential libarchive-tools
          sudo gem install --no-document fpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @dovo/api... --filter @dovo/desktop... -r build
      - name: Build unsigned desktop packages
        run: pnpm exec node scripts/packaging/package-desktop.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.runner }}
          if-no-files-found: error
          path: |
            release/*.exe
            release/*.deb
            release/*.rpm
            release/*.AppImage
            release/*.blockmap
            release/latest*.yml
  server:
    needs: draft
    strategy:
      fail-fast: false
      matrix:
        runner: [macos-15, ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: pnpm/action-setup@v4
      - name: Verify release version
        env:
          TAG: ${{ inputs.tag || github.ref_name }}
        run: node -e 'const p=require("./package.json"); if(process.env.TAG!==`v${p.version}`) throw Error("Tag must match package.json version")'
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @dovo/api... -r build
      - run: node scripts/packaging/package-server.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: server-${{ matrix.runner }}
          path: release/Dovo-Server-*.tar.gz
  upload:
    needs: [server, desktop]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: server-*
          merge-multiple: true
          path: release
      - uses: actions/download-artifact@v4
        with:
          pattern: desktop-*
          merge-multiple: true
          path: release
      - name: Upload unsigned desktop and server packages into draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          gh release upload "$TAG" release/* --clobber
  verify:
    needs: [mac, upload]
    runs-on: ubuntu-24.04
    steps:
      - name: Verify draft assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          gh release view "$TAG" --json assets --jq '.assets[].name' | sort > /tmp/dovo-release-assets
          for pattern in \
            "Dovo-Studio-${TAG#v}-arm64.dmg" \
            "Dovo-Studio-${TAG#v}-arm64.zip" \
            "Dovo-Studio-mise-${TAG#v}-macos-arm64.tar.gz" \
            "Dovo-Server-${TAG#v}-macos-arm64.tar.gz" \
            "Dovo-Server-${TAG#v}-linux-x64.tar.gz" \
            "Dovo-Server-${TAG#v}-linux-arm64.tar.gz" \
            "Dovo-Studio-${TAG#v}-windows-x64.exe" \
            "Dovo-Studio-${TAG#v}-windows-arm64.exe" \
            "Dovo-Studio-${TAG#v}-linux-x64.deb" \
            "Dovo-Studio-${TAG#v}-linux-arm64.deb" \
            "Dovo-Studio-${TAG#v}-linux-x64.rpm" \
            "Dovo-Studio-${TAG#v}-linux-arm64.rpm" \
            "Dovo-Studio-${TAG#v}-linux-x64.AppImage" \
            "Dovo-Studio-${TAG#v}-linux-arm64.AppImage" \
            latest.yml \
            latest-arm64.yml \
            latest-linux.yml \
            latest-linux-arm64.yml \
            latest-mac.yml; do
            grep -Fx "$pattern" /tmp/dovo-release-assets || { echo "::error::Missing release asset: $pattern"; exit 1; }
          done
          echo "Draft $TAG is ready to inspect and publish." >> "$GITHUB_STEP_SUMMARY"
