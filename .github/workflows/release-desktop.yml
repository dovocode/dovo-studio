name: Release
on:
  push:
    tags: ['v*']
  schedule:
    - cron: '17 */3 * * *'
  workflow_dispatch:
    inputs:
      tag:
        description: Leave empty for a nightly, or specify a release tag matching package.json
        required: false
      verify_only:
        description: Verify existing release assets without rebuilding
        type: boolean
        default: false
permissions:
  contents: write
  actions: read
concurrency:
  group: release-${{ github.ref_type == 'branch' && 'nightly' || inputs.tag || github.ref_name }}
  cancel-in-progress: false
jobs:
  draft:
    if: ${{ !inputs.verify_only }}
    runs-on: ubuntu-24.04
    outputs:
      build: ${{ steps.prepare.outputs.build }}
      tag: ${{ steps.prepare.outputs.tag }}
      version: ${{ steps.prepare.outputs.version }}
      channel: ${{ steps.prepare.outputs.channel }}
      app_name: ${{ steps.prepare.outputs.app_name }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Create release draft
        id: prepare
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          INPUT_TAG: ${{ inputs.tag }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          VERSION=$(node -p 'require("./package.json").version')
          if [[ "$GITHUB_EVENT_NAME" == schedule || ( "$GITHUB_EVENT_NAME" == workflow_dispatch && -z "$INPUT_TAG" ) ]]; then
            test "$GITHUB_REF" = "refs/heads/$DEFAULT_BRANCH" || { echo "Nightlies must run on the default branch"; exit 1; }
            if test "$(node scripts/packaging/nightly-changes.mjs "$GITHUB_SHA")" != true; then
              echo "build=false" >> "$GITHUB_OUTPUT"
              echo "No changes since the last published release; skipping nightly." >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            VERSION="${VERSION}-nightly.${GITHUB_RUN_NUMBER}"
            TAG="v${VERSION}"
            CHANNEL=nightly
            APP_NAME='Dovo Studio (Nightly)'
          elif [[ "$GITHUB_REF" == refs/tags/v*-nightly.* ]]; then
            TAG="$GITHUB_REF_NAME"
            [[ "$TAG" =~ ^v${VERSION}-nightly\.[0-9]+$ ]] || { echo 'Nightly tag must match package.json base version'; exit 1; }
            VERSION="${TAG#v}"
            CHANNEL=nightly
            APP_NAME='Dovo Studio (Nightly)'
          else
            TAG="${INPUT_TAG:-$GITHUB_REF_NAME}"
            test "$TAG" = "v${VERSION}" || { echo 'Release tag must match package.json version'; exit 1; }
            CHANNEL=stable
            APP_NAME='Dovo Studio'
          fi
          {
            echo "tag=$TAG"
            echo "version=$VERSION"
            echo "channel=$CHANNEL"
            echo "app_name=$APP_NAME"
          } >> "$GITHUB_OUTPUT"
          EXISTS=false
          if gh release view "$TAG" --json isDraft --jq .isDraft >/tmp/dovo-release-draft 2>/dev/null; then
            if test "$(cat /tmp/dovo-release-draft)" != true; then
              echo 'Release is already published; skipping duplicate tag-triggered build.'
              echo 'build=false' >> "$GITHUB_OUTPUT"
              exit 0
            fi
            EXISTS=true
          fi
          if test "$CHANNEL" = nightly; then
            node scripts/packaging/nightly-notes.mjs "$GITHUB_SHA" > /tmp/dovo-nightly-notes.md
            if test "$EXISTS" = true; then
              gh release edit "$TAG" --target "$GITHUB_SHA" --notes-file /tmp/dovo-nightly-notes.md
            else
              gh release create "$TAG" --draft --prerelease --title "Dovo Studio (Nightly) ${TAG#v}" --target "$GITHUB_SHA" --notes-file /tmp/dovo-nightly-notes.md
            fi
          elif test "$EXISTS" = true; then
            gh release edit "$TAG" --target "$GITHUB_SHA"
          else
            gh release create "$TAG" --draft --title "Dovo Studio ${TAG#v}" --target "$GITHUB_SHA" --generate-notes
          fi
          echo 'build=true' >> "$GITHUB_OUTPUT"
  mac:
    needs: draft
    if: ${{ needs.draft.outputs.build == 'true' }}
    runs-on: macos-26
    timeout-minutes: 45
    env:
      # Compile Tahoe icons on Tahoe: Xcode 26.2 asset runtime crashes on macOS 15.
      DEVELOPER_DIR: /Applications/Xcode_26.2.app/Contents/Developer
      DOVO_RELEASE_VERSION: ${{ needs.draft.outputs.version }}
      DOVO_RELEASE_CHANNEL: ${{ needs.draft.outputs.channel }}
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-build
        id: setup
        with:
          packaging: 'true'
      - name: Verify native macOS icon toolchain
        run: node scripts/packaging/mac-icon-toolchain.mjs
      - name: Verify Apple signing secrets
        env:
          MAC_CERTIFICATE: ${{ secrets.MAC_CERTIFICATE }}
          MAC_CERTIFICATE_PASSWORD: ${{ secrets.MAC_CERTIFICATE_PASSWORD }}
          MAC_SIGNING_IDENTITY: ${{ secrets.MAC_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          for name in MAC_CERTIFICATE MAC_CERTIFICATE_PASSWORD MAC_SIGNING_IDENTITY APPLE_ID APPLE_APP_SPECIFIC_PASSWORD APPLE_TEAM_ID; do
            test -n "${!name}" || { echo "::error::Missing $name secret"; exit 1; }
          done
      - run: pnpm install --frozen-lockfile
      - uses: ./.github/actions/save-dependencies
        with:
          store: ${{ steps.setup.outputs.store }}
          key: ${{ steps.setup.outputs.store-key }}
      - uses: ./.github/actions/task-cache
        with:
          node: ${{ steps.setup.outputs.node }}
      - run: pnpm exec vp run --cache --filter @dovo/api... --filter @dovo/desktop... build
      - run: pnpm run package:prepare-runtime
        env:
          DOVO_PREPARED_RUNTIME: ${{ runner.temp }}/dovo-prepared-runtime
      - name: Build signed update artifacts into a draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_LINK: ${{ secrets.MAC_CERTIFICATE }}
          CSC_KEY_PASSWORD: ${{ secrets.MAC_CERTIFICATE_PASSWORD }}
          CSC_NAME: ${{ secrets.MAC_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          GITHUB_REF_NAME: ${{ needs.draft.outputs.tag }}
        run: |
          # Signing scans the bundled Node runtime and its dependency tree concurrently.
          ulimit -n 65536
          pnpm run package:platform -- --publish
      - uses: actions/upload-artifact@v7
        with:
          compression-level: 0
          name: server-macos-26
          if-no-files-found: error
          path: release/Dovo-Server-*
      - name: Verify Mac signature and notarization
        env:
          APP_NAME: ${{ needs.draft.outputs.app_name }}
        run: |
          codesign --verify --deep --strict --verbose=2 "release/mac-arm64/$APP_NAME.app"
          spctl --assess --type execute --verbose=2 "release/mac-arm64/$APP_NAME.app"
          xcrun stapler validate "release/mac-arm64/$APP_NAME.app"
      - name: Upload mise desktop archive
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.draft.outputs.tag }}
        run: gh release upload "$TAG" release/*-mise-*.tar.gz --clobber
  platform:
    needs: draft
    if: ${{ needs.draft.outputs.build == 'true' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-2025
            arch: x64
            unpacked: win-unpacked
          - runner: windows-11-arm
            arch: arm64
            unpacked: win-arm64-unpacked
          - runner: ubuntu-24.04
            arch: x64
          - runner: ubuntu-24.04-arm
            arch: arm64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      USE_SYSTEM_FPM: 'true'
      DOVO_RELEASE_VERSION: ${{ needs.draft.outputs.version }}
      DOVO_RELEASE_CHANNEL: ${{ needs.draft.outputs.channel }}
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-build
        id: setup
        with:
          architecture: ${{ matrix.arch }}
          packaging: 'true'
      - name: Verify native architecture
        env:
          EXPECTED_ARCH: ${{ matrix.arch }}
        run: node -e "if(process.arch!==process.env.EXPECTED_ARCH) throw Error('Native architecture mismatch')"
      - name: Install Linux packaging tools
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y rpm ruby-dev build-essential libarchive-tools
          sudo gem install --no-document fpm
      - run: pnpm install --frozen-lockfile
      - uses: ./.github/actions/save-dependencies
        with:
          store: ${{ steps.setup.outputs.store }}
          key: ${{ steps.setup.outputs.store-key }}
      - uses: ./.github/actions/task-cache
        with:
          node: ${{ steps.setup.outputs.node }}
      - run: pnpm exec vp run --cache --filter @dovo/api... --filter @dovo/desktop... build
      - run: pnpm run package:prepare-runtime
        env:
          DOVO_PREPARED_RUNTIME: ${{ runner.temp }}/dovo-prepared-runtime
      - name: Build Linux desktop and server packages
        if: runner.os == 'Linux'
        run: pnpm run package:platform
      - name: Build native Windows app and server archive
        if: runner.os == 'Windows'
        run: pnpm run package:platform -- --dir
      - uses: actions/upload-artifact@v7
        if: runner.os == 'Windows'
        with:
          compression-level: 0
          name: windows-unpacked-${{ matrix.arch }}
          if-no-files-found: error
          path: release/${{ matrix.unpacked }}/
      - uses: actions/upload-artifact@v7
        if: runner.os == 'Linux'
        with:
          compression-level: 0
          name: desktop-${{ matrix.runner }}
          if-no-files-found: error
          path: |
            release/*.exe
            release/*.deb
            release/*.rpm
            release/*.AppImage
            release/*.blockmap
            release/latest*.yml
            release/nightly*.yml
      - uses: actions/upload-artifact@v7
        with:
          compression-level: 0
          name: server-${{ matrix.runner }}
          if-no-files-found: error
          path: release/Dovo-Server-*
  windows-sign:
    needs: [draft, platform]
    runs-on: windows-2025
    timeout-minutes: 45
    permissions:
      contents: read
      actions: read
      id-token: write
    environment: windows-signing
    strategy:
      fail-fast: false
      matrix:
        arch: [x64, arm64]
    env:
      DOVO_RELEASE_VERSION: ${{ needs.draft.outputs.version }}
      DOVO_RELEASE_CHANNEL: ${{ needs.draft.outputs.channel }}
      AZURE_SIGNING_ENDPOINT: ${{ vars.AZURE_SIGNING_ENDPOINT }}
      AZURE_SIGNING_ACCOUNT: ${{ vars.AZURE_SIGNING_ACCOUNT }}
      AZURE_SIGNING_PROFILE: ${{ vars.AZURE_SIGNING_PROFILE }}
      AZURE_SIGNING_PUBLISHER: ${{ vars.AZURE_SIGNING_PUBLISHER }}
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-build
        id: setup
        with:
          packaging: 'true'
      - name: Verify signing configuration
        shell: pwsh
        env:
          AZURE_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
          AZURE_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
          AZURE_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
        run: |
          foreach ($name in @('AZURE_CLIENT_ID', 'AZURE_TENANT_ID', 'AZURE_SUBSCRIPTION_ID', 'AZURE_SIGNING_ENDPOINT', 'AZURE_SIGNING_ACCOUNT', 'AZURE_SIGNING_PROFILE', 'AZURE_SIGNING_PUBLISHER')) {
            if (-not [Environment]::GetEnvironmentVariable($name)) { throw "Missing $name environment variable" }
          }
      - run: pnpm install --frozen-lockfile
      - uses: ./.github/actions/save-dependencies
        with:
          store: ${{ steps.setup.outputs.store }}
          key: ${{ steps.setup.outputs.store-key }}
      - uses: actions/download-artifact@v8
        with:
          name: windows-unpacked-${{ matrix.arch }}
          path: work/windows-app
      - name: Azure login with GitHub OIDC
        uses: azure/login@v3
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - name: Select Windows PE binaries for signing
        id: signing-files
        run: node scripts/packaging/windows-signing-files.mjs work/windows-app
      - name: Sign native app and bundled runtime
        uses: azure/artifact-signing-action@v2
        with:
          endpoint: ${{ vars.AZURE_SIGNING_ENDPOINT }}
          signing-account-name: ${{ vars.AZURE_SIGNING_ACCOUNT }}
          certificate-profile-name: ${{ vars.AZURE_SIGNING_PROFILE }}
          files: ${{ steps.signing-files.outputs.files }}
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256
      - name: Build signed installer and uninstaller, then generate update hashes
        run: node scripts/packaging/package-windows-signed.mjs ${{ matrix.arch }} work/windows-app
      - name: Verify app and installer signatures
        shell: pwsh
        run: |
          $signTool = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin\*\x64\signtool.exe" | Sort-Object FullName -Descending | Select-Object -First 1
          if (-not $signTool) { throw 'Windows SDK SignTool is missing' }
          $paths = @(Get-Content work/windows-signing-files.json -Raw | ConvertFrom-Json)
          $files = @($paths | ForEach-Object { Get-Item -LiteralPath $_ }) + @(Get-ChildItem release -File -Filter *.exe) + @(Get-Item work/windows-app/resources/elevate.exe)
          if (-not (Get-ChildItem release -File -Filter *.exe)) { throw 'Missing signed installer' }
          foreach ($file in $files) {
            # /pa verifies the embedded signature; /a would prefer Windows catalog signatures.
            & $signTool.FullName verify /pa /v $file.FullName
            if ($LASTEXITCODE -ne 0) { throw "Invalid embedded signature: $($file.FullName)" }
            $signedCertificate = [System.Security.Cryptography.X509Certificates.X509Certificate]::CreateFromSignedFile($file.FullName)
            $certificate = [System.Security.Cryptography.X509Certificates.X509Certificate2]::new($signedCertificate)
            try {
              $publisher = $certificate.GetNameInfo([System.Security.Cryptography.X509Certificates.X509NameType]::SimpleName, $false)
              if ($publisher -cne $env:AZURE_SIGNING_PUBLISHER) { throw "Unexpected publisher for $($file.FullName): $publisher" }
            } finally {
              $certificate.Dispose()
              $signedCertificate.Dispose()
            }
          }
      - uses: actions/upload-artifact@v7
        with:
          compression-level: 0
          name: desktop-windows-${{ matrix.arch }}
          if-no-files-found: error
          path: |
            release/*.exe
            release/*.blockmap
            release/latest*.yml
            release/nightly*.yml
  upload:
    needs: [draft, mac, platform, windows-sign]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: server-*
          merge-multiple: true
          path: release
      - uses: actions/download-artifact@v8
        with:
          pattern: desktop-*
          merge-multiple: true
          path: release
      - name: Upload desktop and server packages into draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.draft.outputs.tag }}
        run: |
          gh release upload "$TAG" release/* --clobber
  verify:
    if: ${{ always() && (inputs.verify_only || (needs.mac.result == 'success' && needs.upload.result == 'success')) }}
    needs: [draft, mac, upload]
    runs-on: ubuntu-24.04
    steps:
      - name: Verify release assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.draft.outputs.tag || inputs.tag || github.ref_name }}
          CHANNEL: ${{ needs.draft.outputs.channel }}
        run: |
          # verify_only skips the draft job, so derive the channel from the nightly tag convention.
          if test -z "$CHANNEL"; then
            case "$TAG" in
              *-nightly.*) CHANNEL=nightly ;;
              *) CHANNEL=stable ;;
            esac
          fi
          gh release view "$TAG" --json assets --jq '.assets[].name' | sort > /tmp/dovo-release-assets
          if test "$CHANNEL" = nightly; then
            PREFIX=Dovo-Studio-Nightly
            SERVER=Dovo-Server-Nightly
            FEED=nightly
          else
            PREFIX=Dovo-Studio
            SERVER=Dovo-Server
            FEED=latest
          fi
          for pattern in \
            "$PREFIX-${TAG#v}-arm64.dmg" \
            "$PREFIX-${TAG#v}-arm64.zip" \
            "$PREFIX-mise-${TAG#v}-macos-arm64.tar.gz" \
            "$SERVER-${TAG#v}-macos-arm64.tar.gz" \
            "$SERVER-${TAG#v}-linux-x64.tar.gz" \
            "$SERVER-${TAG#v}-linux-arm64.tar.gz" \
            "$SERVER-${TAG#v}-windows-x64.zip" \
            "$SERVER-${TAG#v}-windows-arm64.zip" \
            "$PREFIX-${TAG#v}-windows-x64.exe" \
            "$PREFIX-${TAG#v}-windows-arm64.exe" \
            "$PREFIX-${TAG#v}-linux-amd64.deb" \
            "$PREFIX-${TAG#v}-linux-arm64.deb" \
            "$PREFIX-${TAG#v}-linux-x86_64.rpm" \
            "$PREFIX-${TAG#v}-linux-aarch64.rpm" \
            "$PREFIX-${TAG#v}-linux-x86_64.AppImage" \
            "$PREFIX-${TAG#v}-linux-arm64.AppImage" \
            "$FEED.yml" \
            "$FEED-arm64.yml" \
            "$FEED-linux.yml" \
            "$FEED-linux-arm64.yml" \
            "$FEED-mac.yml"; do
            grep -Fx "$pattern" /tmp/dovo-release-assets || { echo "::error::Missing release asset: $pattern"; exit 1; }
          done
          echo "Release $TAG has all required assets." >> "$GITHUB_STEP_SUMMARY"
  publish-nightly:
    needs: [draft, verify]
    if: ${{ needs.draft.outputs.channel == 'nightly' && needs.verify.result == 'success' }}
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      actions: write
    steps:
      - name: Require passing Check workflow
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          for attempt in {1..40}; do
            result=$(gh run list --workflow Check --commit "$SHA" --limit 1 --json status,conclusion --jq '.[0] | if . == null then "missing" else (.status + ":" + .conclusion) end')
            if test "$result" = completed:success; then exit 0; fi
            if [[ "$result" == completed:* ]]; then
              echo "::error::Check workflow did not pass for $SHA: $result"
              exit 1
            fi
            echo "Waiting for Check ($attempt/40): $result"
            sleep 15
          done
          echo "::error::Check workflow did not complete for $SHA"
          exit 1
      - name: Publish verified nightly
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.draft.outputs.tag }}
        run: gh release edit "$TAG" --draft=false --prerelease --latest=false
      - name: Update Homebrew and mise distribution
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.draft.outputs.tag }}
        run: gh workflow run distribution.yml -f tag="$TAG"
