name: Update Homebrew, mise and container distribution
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Published stable or nightly release tag
        required: true
permissions:
  contents: write
concurrency:
  group: distribution
  cancel-in-progress: false
jobs:
  metadata:
    if: github.event_name == 'workflow_dispatch' || startsWith(github.event.release.tag_name, 'v')
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.repository.default_branch }}
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
      - name: Generate definitions from published assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ inputs.tag || github.event.release.tag_name }}
        run: |
          [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-nightly\.[0-9]+)?$ ]] || { echo 'Stable or nightly version required'; exit 1; }
          test "$(gh release view "$TAG" --json isDraft --jq .isDraft)" = false
          if [[ "$TAG" == *-nightly.* ]]; then
            test "$(gh release view "$TAG" --json isPrerelease --jq .isPrerelease)" = true
          else
            test "$(gh release view "$TAG" --json isPrerelease --jq .isPrerelease)" = false
            test "$(gh release view --json tagName --jq .tagName)" = "$TAG"
          fi
          gh release download "$TAG" --dir work/release-assets
          node scripts/packaging/generate-distribution.mjs work/release-assets work/distribution "${TAG#v}"
          cp -R work/distribution/Formula work/distribution/Casks .
          gh release upload "$TAG" work/distribution/mise.toml work/distribution/SHA256SUMS --clobber
      - name: Update tap definitions
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Formula Casks
          if ! git diff --cached --quiet; then
            git commit -m 'Update Homebrew distribution definitions'
            git pull --rebase origin "${{ github.event.repository.default_branch }}"
            git push
          fi
  # Publish the runtime image from the published Linux server archives. The Release workflow only
  # builds drafts. Publishing here keeps unreviewed Stable drafts and unverified nightlies off GHCR.
  container:
    if: github.event_name == 'workflow_dispatch' || startsWith(github.event.release.tag_name, 'v')
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
    env:
      TAG: ${{ inputs.tag || github.event.release.tag_name }}
    steps:
      - name: Check release and choose image tags
        id: release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          OWNER: ${{ github.repository_owner }}
        run: |
          [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-nightly\.[0-9]+)?$ ]] || { echo 'Stable or nightly version required'; exit 1; }
          test "$(gh release view "$TAG" --json isDraft --jq .isDraft)" = false
          IMAGE="ghcr.io/${OWNER,,}/dovo-server"
          if [[ "$TAG" == *-nightly.* ]]; then
            test "$(gh release view "$TAG" --json isPrerelease --jq .isPrerelease)" = true
            CHANNEL=nightly
            PRERELEASE=true
            PATTERN='^v[0-9]+\.[0-9]+\.[0-9]+-nightly\.[0-9]+$'
          else
            test "$(gh release view "$TAG" --json isPrerelease --jq .isPrerelease)" = false
            CHANNEL=latest
            PRERELEASE=false
            PATTERN='^v[0-9]+\.[0-9]+\.[0-9]+$'
          fi
          # Every release gets its version tag. Only the highest published version of its channel
          # moves the channel tag, so a patch for an older line or a re-run cannot move it back.
          NEWEST="$(
            gh release list --limit 1000 --json tagName,isDraft,isPrerelease \
              --jq ".[] | select((.isDraft | not) and .isPrerelease == $PRERELEASE) | .tagName" |
              { grep -E "$PATTERN" || true; } | sort -V | tail -n 1
          )"
          TAGS="$IMAGE:${TAG#v}"
          if [[ "$NEWEST" == "$TAG" ]]; then
            TAGS+=$'\n'"$IMAGE:$CHANNEL"
          else
            echo "::notice::$TAG is older than $NEWEST, so the $CHANNEL image tag stays on $NEWEST."
          fi
          {
            echo "version=${TAG#v}"
            echo 'tags<<EOF'
            echo "$TAGS"
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.TAG }}
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
      - name: Download published Linux server archives
        id: source
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release download "$TAG" --pattern 'Dovo-Server*-linux-*.tar.gz' --dir release
          echo "revision=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - name: Build linux/amd64 image for checks
        uses: docker/build-push-action@v7
        with:
          context: .
          file: apps/api/Dockerfile
          platforms: linux/amd64
          load: true
          tags: dovo-server:release-check
      - name: Check health, pairing and volume persistence
        run: node scripts/packaging/runtime-image-smoke.mjs dovo-server:release-check
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push linux/amd64 and linux/arm64
        uses: docker/build-push-action@v7
        with:
          context: .
          file: apps/api/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.release.outputs.tags }}
          labels: |
            org.opencontainers.image.version=${{ steps.release.outputs.version }}
            org.opencontainers.image.revision=${{ steps.source.outputs.revision }}
