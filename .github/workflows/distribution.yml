name: Update Homebrew and mise distribution
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Published stable release tag
        required: true
permissions:
  contents: write
concurrency:
  group: distribution
  cancel-in-progress: false
jobs:
  metadata:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Generate definitions from published assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ inputs.tag || github.event.release.tag_name }}
        run: |
          [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo 'Stable version required'; exit 1; }
          test "$(gh release view "$TAG" --json isDraft --jq .isDraft)" = false
          test "$(gh release view --json tagName --jq .tagName)" = "$TAG"
          gh release download "$TAG" --dir work/release-assets
          node scripts/packaging/generate-distribution.mjs work/release-assets work/distribution "${TAG#v}"
          cp -R work/distribution/Formula work/distribution/Casks .
          gh release upload "$TAG" work/distribution/mise.toml work/distribution/SHA256SUMS --clobber
      - name: Update tap definitions
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Formula Casks
          if ! git diff --cached --quiet; then
            git commit -m 'Update Homebrew distribution definitions'
            git push
          fi
