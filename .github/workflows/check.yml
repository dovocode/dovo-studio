name: Check
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-build
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm check
      - run: pnpm typecheck
      - run: node scripts/check-mobile-markdown-queue.mjs
      - run: node scripts/check-runtime-sync.mjs
      # All packages were compiled above; the local test command intentionally builds first.
      - run: pnpm exec vp test --maxWorkers=4
      - run: node --test scripts/packaging/*.test.mjs
