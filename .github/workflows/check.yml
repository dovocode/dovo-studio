name: Check
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: check-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-build
        id: setup
      - run: pnpm install --frozen-lockfile
      - uses: ./.github/actions/save-dependencies
        with:
          store: ${{ steps.setup.outputs.store }}
          key: ${{ steps.setup.outputs.store-key }}
      - uses: ./.github/actions/task-cache
        with:
          node: ${{ steps.setup.outputs.node }}
      - run: pnpm build
      - run: pnpm check
      - run: pnpm typecheck
      - run: node scripts/check-runtime-sync.mjs
      # Native config errors (plugins, bundle identifiers, entitlements) fail here, not at build.
      - run: pnpm --filter @dovo/mobile exec expo config --type public > /dev/null
      # All packages were compiled above; the local test command intentionally builds first.
      - run: pnpm exec vp test --maxWorkers=4
      - run: node --test scripts/packaging/*.test.mjs
  # Bounded browser gate for shared hooks that render in both desktop and mobile bundles.
  browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-build
        id: setup
      - run: pnpm install --frozen-lockfile
      - uses: ./.github/actions/save-dependencies
        with:
          store: ${{ steps.setup.outputs.store }}
          key: ${{ steps.setup.outputs.store-key }}
      # The history harness bundles against the published protocol entry point.
      - run: pnpm --filter @dovo/protocol --filter @dovo/client-runtime -r build
      - run: pnpm --filter @dovo/runtime exec playwright install --with-deps chromium
      # Browser suites retry once; the job summary names any suite that only passed on retry.
      - run: node scripts/retry-browser.mjs pnpm test:startup-draft:browser
      - run: node scripts/retry-browser.mjs pnpm test:conversation-history:browser
      - run: node scripts/retry-browser.mjs pnpm test:turn-grouping:browser
      - run: node scripts/retry-browser.mjs pnpm test:artifacts:browser
      - run: node scripts/retry-browser.mjs pnpm test:scoped-settings:browser
      - run: node scripts/retry-browser.mjs pnpm test:shared-storage:browser
      - run: node scripts/retry-browser.mjs pnpm test:remote-browser-recovery:browser
      - run: node scripts/retry-browser.mjs pnpm test:mobile-composer:browser
      - run: node scripts/retry-browser.mjs pnpm test:mobile-startup-thread:browser
      - run: node scripts/retry-browser.mjs pnpm test:mobile-energy:browser
      - run: node scripts/retry-browser.mjs pnpm test:mobile-appearance:browser
      - run: node scripts/retry-browser.mjs pnpm test:composer-send:browser
      - run: node scripts/retry-browser.mjs pnpm test:composer-providers:browser
      - run: node scripts/retry-browser.mjs pnpm test:composer-unification:browser
      # The next four suites load apps/desktop/dist, which composer-unification builds above.
      - run: node scripts/retry-browser.mjs pnpm test:pull-workspace:browser
      - run: node scripts/retry-browser.mjs pnpm test:pull-stability:browser
      - run: node scripts/retry-browser.mjs pnpm test:section-thread:browser
      - run: node scripts/retry-browser.mjs pnpm test:manual-model:browser
      - run: node scripts/retry-browser.mjs pnpm test:thread-startup:browser
      - run: node scripts/retry-browser.mjs pnpm test:settings-target:browser
      - run: node scripts/retry-browser.mjs pnpm test:subagent-grouping:browser
  # The full suite above covers Linux. Keep real macOS native/process behavior exercised too.
  runtime-mac:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-build
        id: setup
      - run: pnpm install --frozen-lockfile
      - uses: ./.github/actions/save-dependencies
        with:
          store: ${{ steps.setup.outputs.store }}
          key: ${{ steps.setup.outputs.store-key }}
      - uses: ./.github/actions/task-cache
        with:
          node: ${{ steps.setup.outputs.node }}
      - run: pnpm exec vp run --cache --filter @dovo/api... build
      - run: node scripts/check-mobile-markdown-queue.mjs
      - run: node --test scripts/packaging/desktop-build-stamp.test.mjs scripts/packaging/prepared-runtime.test.mjs
      - run: >-
          pnpm exec vp test --maxWorkers=3
          apps/api/src
          packages/runtime/src/services.test.ts
          packages/runtime/src/storage
          packages/runtime/src/computer-use
          packages/runtime/src/terminal
          packages/runtime/src/agents/tasks/delegation
          packages/runtime/src/agents/tasks/housekeeping.test.ts
          packages/runtime/src/agents/tasks/restart-recovery.test.ts
          packages/runtime/src/scm/tasks/pending-checkouts.test.ts
          packages/runtime/src/http/task-lifecycle.test.ts
          packages/runtime/src/http/server-updates.test.ts
          packages/runtime/src/agents/execution/stop-owned-child
          packages/runtime/src/agents/providers/hermes
          packages/runtime/src/agents/providers/acp/acp-connection.test.ts
          packages/runtime/src/agents/providers/codex/codex-modes.test.ts
          packages/runtime/src/agents/configuration/acp-installations.test.ts
          packages/runtime/src/previews/physical-device-startup.test.ts
          apps/desktop/electron
  # Windows shell selection, launcher and server lifecycle suites.
  windows:
    runs-on: windows-2025
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-build
        id: setup
      - run: pnpm install --frozen-lockfile
      - uses: ./.github/actions/save-dependencies
        with:
          store: ${{ steps.setup.outputs.store }}
          key: ${{ steps.setup.outputs.store-key }}
      - uses: ./.github/actions/task-cache
        with:
          node: ${{ steps.setup.outputs.node }}
      - run: pnpm exec vp run --cache --filter @dovo/api... build
      - run: node --test scripts/packaging/desktop-build-stamp.test.mjs scripts/packaging/prepared-runtime.test.mjs
      - run: >-
          pnpm exec vp test --maxWorkers=4
          packages/runtime/src/terminal
          packages/runtime/src/services.test.ts
          packages/runtime/src/computer-use
          packages/runtime/src/agents/execution/stop-owned-child
          packages/runtime/src/process.test.ts
          apps/desktop/electron/windows-runtime.test.ts
          apps/desktop/electron/runtime-connection-health.test.ts
          apps/desktop/electron/wsl-runtime-health.test.ts
          apps/desktop/electron/local-runtime.test.ts
          apps/desktop/electron/main.test.ts
          apps/desktop/electron/task-launcher.test.ts
          apps/api/src/server-manager.test.ts
          apps/api/src/server-service.test.ts
          apps/api/src/server-cli.test.ts
      # Keep cold PowerShell startup separate from concurrent PTY and server tests.
      - run: pnpm exec vp test --maxWorkers=1 apps/desktop/electron/windows-security.test.ts
