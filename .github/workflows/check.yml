name: Check
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: check-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-build
        id: setup
      - run: pnpm install --frozen-lockfile
      - uses: ./.github/actions/save-dependencies
        with:
          store: ${{ steps.setup.outputs.store }}
          key: ${{ steps.setup.outputs.store-key }}
      - uses: ./.github/actions/task-cache
        with:
          node: ${{ steps.setup.outputs.node }}
      - run: node scripts/ci/workspace-task.mjs build
      - run: pnpm check
      - run: node scripts/ci/workspace-task.mjs typecheck
      - run: node scripts/check-runtime-sync.mjs
      # Native config errors (plugins, bundle identifiers, entitlements) fail here, not at build.
      - run: pnpm --filter @dovo/mobile exec expo config --type public > /dev/null
      # Execute bundled dependencies: a successful export alone misses startup require failures.
      - run: node scripts/check-mobile-metro-modules.mjs
      # All packages were compiled above; the local test command intentionally builds first.
      - uses: ./.github/actions/setup-browser
      - run: pnpm exec vp test --maxWorkers=4
      - name: Verify native browser extensions
        run: pnpm test:browser-extensions:native
      - name: Verify browser tab capture and media consent
        run: |
          # Chromium discovers shareable X11 windows through the window manager's client list.
          # Xvfb alone provides screens but no managed window sources.
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends openbox x11-utils
          xvfb-run -a -s '-screen 0 1280x900x24' bash -euc '
            openbox >/tmp/dovo-openbox.log 2>&1 &
            wm_pid=$!
            trap "kill $wm_pid 2>/dev/null || true" EXIT
            for attempt in {1..50}; do
              if xprop -root _NET_SUPPORTING_WM_CHECK 2>/dev/null | grep -q "window id"; then
                pnpm test:browser-media:native
                exit 0
              fi
              sleep 0.1
            done
            cat /tmp/dovo-openbox.log
            echo "Window manager did not become ready" >&2
            exit 1
          '
      - name: Verify persistent daily TURN quota
        run: python3 -m unittest discover -s apps/connect-server/turn/budget -p 'test_*.py'
      - name: Verify TURN cutoff in an isolated network namespace
        run: |
          sudo apt-get update
          sudo apt-get install -y nftables iproute2
          python3 apps/connect-server/turn/budget/check_kernel.py
      - run: node --test scripts/packaging/*.test.mjs scripts/ci/*.test.mjs
  # Bounded browser gate for shared hooks that render in both desktop and mobile bundles.
  browser:
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3]
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      # Keep catalog interactions here; its full matrix has a separate job below.
      DOVO_DESIGN_INTERACTIONS_ONLY: '1'
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-build
        id: setup
      - run: pnpm install --frozen-lockfile
      - uses: ./.github/actions/save-dependencies
        with:
          store: ${{ steps.setup.outputs.store }}
          key: ${{ steps.setup.outputs.store-key }}
      - uses: ./.github/actions/task-cache
        with:
          node: ${{ steps.setup.outputs.node }}
          scope: browser-${{ matrix.shard }}
      - uses: ./.github/actions/setup-browser
      # All registered suites run; four jobs keep each shard bounded.
      - name: Run browser shard
        timeout-minutes: 20
        env:
          DOVO_BROWSER_TIMINGS: ${{ runner.temp }}/browser-timings-${{ matrix.shard }}.json
        run: node scripts/run-browser-suites.mjs ${{ matrix.shard }} 4
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: browser-timings-${{ matrix.shard }}
          path: ${{ runner.temp }}/browser-timings-${{ matrix.shard }}.json
          if-no-files-found: ignore
  # Partition every story and hosted-service theme/viewport/accessibility case.
  # The browser registry runs the interactions-only pass exactly once.
  design-system:
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-build
        id: setup
      - run: pnpm install --frozen-lockfile
      - uses: ./.github/actions/save-dependencies
        with:
          store: ${{ steps.setup.outputs.store }}
          key: ${{ steps.setup.outputs.store-key }}
      - uses: ./.github/actions/task-cache
        with:
          node: ${{ steps.setup.outputs.node }}
          scope: design-system-${{ matrix.shard }}
      - uses: ./.github/actions/setup-browser
      - run: node scripts/ci/workspace-task.mjs build
      - run: node scripts/check-design-system-browser.mjs ${{ matrix.shard }} 4
  # The full suite above covers Linux. Keep real macOS native/process behavior exercised too.
  runtime-mac:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-build
        id: setup
      - run: pnpm install --frozen-lockfile
      - uses: ./.github/actions/save-dependencies
        with:
          store: ${{ steps.setup.outputs.store }}
          key: ${{ steps.setup.outputs.store-key }}
      - uses: ./.github/actions/task-cache
        with:
          node: ${{ steps.setup.outputs.node }}
      - run: pnpm exec vp run --cache --filter @dovo/api... build
      - run: node scripts/check-mobile-markdown-queue.mjs
      - run: node --test scripts/packaging/desktop-build-stamp.test.mjs scripts/packaging/prepared-runtime.test.mjs
      - run: >-
          pnpm exec vp test --maxWorkers=3
          apps/api/src
          packages/runtime/src/services.test.ts
          packages/runtime/src/storage
          packages/runtime/src/computer-use
          packages/runtime/src/terminal
          packages/runtime/src/agents/tasks/delegation
          packages/runtime/src/agents/tasks/housekeeping.test.ts
          packages/runtime/src/agents/tasks/restart-recovery.test.ts
          packages/runtime/src/scm/tasks/pending-checkouts.test.ts
          packages/runtime/src/http/task-lifecycle.test.ts
          packages/runtime/src/http/server-updates.test.ts
          packages/runtime/src/agents/execution/stop-owned-child
          packages/runtime/src/agents/providers/hermes
          packages/runtime/src/agents/providers/acp/acp-connection.test.ts
          packages/runtime/src/agents/providers/codex/codex-modes.test.ts
          packages/runtime/src/agents/configuration/acp-installations.test.ts
          packages/runtime/src/previews/physical-device-startup.test.ts
          apps/desktop/electron
  # Windows shell selection, launcher and server lifecycle suites.
  windows:
    # Temporarily paused; keep the job definition for restoring Windows coverage.
    if: ${{ false }}
    runs-on: windows-2025
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-build
        id: setup
      - run: pnpm install --frozen-lockfile
      - uses: ./.github/actions/save-dependencies
        with:
          store: ${{ steps.setup.outputs.store }}
          key: ${{ steps.setup.outputs.store-key }}
      - uses: ./.github/actions/task-cache
        with:
          node: ${{ steps.setup.outputs.node }}
      - run: pnpm exec vp run --cache --filter @dovo/api... build
      - run: node --test scripts/packaging/desktop-build-stamp.test.mjs scripts/packaging/prepared-runtime.test.mjs
      - run: >-
          pnpm exec vp test --maxWorkers=4
          --exclude packages/runtime/src/terminal/terminal-shell.test.ts
          packages/runtime/src/terminal
          packages/runtime/src/services.test.ts
          packages/runtime/src/computer-use
          packages/runtime/src/agents/execution/stop-owned-child
          packages/runtime/src/process.test.ts
          apps/desktop/electron/windows-runtime.test.ts
          apps/desktop/electron/runtime-connection-health.test.ts
          apps/desktop/electron/wsl-runtime-health.test.ts
          apps/desktop/electron/local-runtime.test.ts
          apps/desktop/electron/main.test.ts
          apps/desktop/electron/task-launcher.test.ts
          apps/api/src/server-manager.test.ts
          apps/api/src/server-service.test.ts
          apps/api/src/server-cli.test.ts
      # Keep cold interactive PowerShell startup separate from PTY stress and server tests.
      - run: >-
          pnpm exec vp test --maxWorkers=1
          packages/runtime/src/terminal/terminal-shell.test.ts
          apps/desktop/electron/windows-security.test.ts
