name: Runtime image
on:
  pull_request:
    paths: &paths
      - apps/api/Dockerfile
      - apps/api/Dockerfile.dockerignore
      - apps/api/compose.yaml
      - apps/api/docker-start.sh
      - apps/api/src/index.ts
      - apps/api/src/server-cli.ts
      - apps/api/src/server-config.ts
      - scripts/packaging/**
      - .node-version
      - .github/workflows/runtime-image.yml
  push:
    branches: [main]
    paths: *paths
permissions:
  contents: read
concurrency:
  group: runtime-image-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  # Build the Linux server archive as Release does, then package and test it as an image.
  # The shared actions restore the dependency, task and dictation caches. No image layer cache is
  # saved: the runtime layer is over 1 GB, changes with every commit and would evict those caches.
  image:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-build
        id: setup
        with:
          packaging: 'true'
      - uses: ./.github/actions/cache-dictation
      - run: pnpm install --frozen-lockfile
      - uses: ./.github/actions/task-cache
        with:
          node: ${{ steps.setup.outputs.node }}
      - run: pnpm exec vp run --cache --filter @dovo/api... build
      - run: pnpm run package:server
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@v4
      - name: Build linux/amd64 image without pushing
        uses: docker/build-push-action@v7
        with:
          context: .
          file: apps/api/Dockerfile
          platforms: linux/amd64
          load: true
          push: false
          tags: dovo-server:ci
      - name: Check health, pairing and volume persistence
        run: node scripts/packaging/runtime-image-smoke.mjs dovo-server:ci
