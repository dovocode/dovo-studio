name: Runtime image
on:
  pull_request:
    paths: &paths
      - apps/api/Dockerfile
      - apps/api/Dockerfile.dockerignore
      - apps/api/compose.yaml
      - apps/api/docker-start.sh
      - apps/api/src/index.ts
      - apps/api/src/server-cli.ts
      - apps/api/src/server-config.ts
      - scripts/packaging/**
      - .node-version
      - .github/workflows/runtime-image.yml
  push:
    branches: [main]
    paths: *paths
permissions:
  contents: read
concurrency:
  group: runtime-image-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  # Build the Linux server archive as Release does, then package and test it as an image.
  # The shared actions restore the dependency, task and dictation caches. No image layer cache is
  # saved: the runtime layer is over 1 GB, changes with every commit and would evict those caches.
  image:
    strategy:
      fail-fast: false
      matrix:
        include:
          - architecture: amd64
            runner: ubuntu-24.04
          - architecture: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-build
        id: setup
        with:
          packaging: 'true'
      - uses: ./.github/actions/cache-dictation
      - run: pnpm install --frozen-lockfile
      - uses: ./.github/actions/task-cache
        with:
          node: ${{ steps.setup.outputs.node }}
      - run: pnpm exec vp run --cache --filter @dovo/api... build
      - run: pnpm run package:server
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@v4
      - name: Build native Linux image without pushing
        uses: docker/build-push-action@v7
        with:
          context: .
          file: apps/api/Dockerfile
          platforms: linux/${{ matrix.architecture }}
          load: true
          push: false
          tags: dovo-server:ci
      - name: Check health, pairing and persisted draft
        env:
          PREVIOUS_IMAGE: ${{ vars.DOVO_RUNTIME_IMAGE_BASELINE }}
          ARCHITECTURE: ${{ matrix.architecture }}
        run: |
          if test -n "$PREVIOUS_IMAGE"; then
            [[ "$PREVIOUS_IMAGE" =~ ^ghcr\.io/dovocode/dovo-server@sha256:[a-f0-9]{64}$ ]] ||
              { echo "DOVO_RUNTIME_IMAGE_BASELINE must pin a Dovo runtime image digest"; exit 1; }
            docker pull --platform "linux/$ARCHITECTURE" "$PREVIOUS_IMAGE"
            node scripts/packaging/runtime-image-smoke.mjs dovo-server:ci "$PREVIOUS_IMAGE"
          else
            node scripts/packaging/runtime-image-smoke.mjs dovo-server:ci
          fi
