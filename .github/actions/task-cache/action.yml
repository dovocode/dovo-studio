name: Cache build and typecheck tasks
description: Restore content-validated Vite Task results after dependencies are installed.
inputs:
  node:
    description: Exact Node version from setup-build.
    required: true
  scope:
    description: Unique writer scope (include the shard for matrix jobs).
    default: ${{ github.job }}
runs:
  using: composite
  steps:
    - uses: actions/cache@v6
      with:
        path: node_modules/.vite/task-cache
        # Vite Task validates source, dependencies and outputs; the Actions key only scopes tools.
        key: vite-task-v2-${{ runner.os }}-${{ runner.arch }}-node-${{ inputs.node }}-${{ hashFiles('pnpm-lock.yaml') }}-${{ inputs.scope }}-${{ github.run_id }}-${{ github.run_attempt }}
        restore-keys: |
          vite-task-v2-${{ runner.os }}-${{ runner.arch }}-node-${{ inputs.node }}-${{ hashFiles('pnpm-lock.yaml') }}-${{ inputs.scope }}-
          vite-task-v2-${{ runner.os }}-${{ runner.arch }}-node-${{ inputs.node }}-${{ hashFiles('pnpm-lock.yaml') }}-
