[package]
name = "dovo-ios-device"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
idevice = { git = "https://github.com/jkcoxson/idevice", rev = "d32c8189c51c2789496b0768039419c3705498c3", default-features = false, features = [
  "ring",
  "usbmuxd",
  "core_device_proxy",
  "tunnel_tcp_stack",
  "display_stream",
] }
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4"] }
plist = "1"
