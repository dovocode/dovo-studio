entry = [
  "packages/*/src/index.ts",
  "packages/**/*.test.ts",
  "apps/**/*.test.{ts,tsx}",
  # Actual process and framework roots; app modules are reached through their imports.
  "apps/api/src/{index,cli,server-cli,dev}.ts",
  "apps/desktop/src/main.tsx",
  "apps/web/src/{client,router}.tsx",
  "apps/web/src/routes/**/*.{ts,tsx}",
  "apps/site/src/app/**/{page,layout,not-found,error,loading,route,sitemap,robots}.{ts,tsx}",
  "apps/mobile/src/app/**/*.{ts,tsx}",
  # Metro selects these iOS implementations instead of their unsuffixed counterparts.
  "apps/mobile/src/**/*.ios.tsx",
  "apps/mobile/index.ts",
  "apps/desktop/electron/{main,preload}.ts",
  # Expo config plugins are referenced by path from app.config.ts, not imported.
  "apps/mobile/plugins/*.ts",
  # Esbuild selects these entrypoints/aliases by path in build-hosted-catalog.mjs.
  "apps/design-system/src/hosted-screens-website-{entry,image,link}.tsx",
  # Native Storybook and Expo Router discover their configuration and routes by path.
  "apps/mobile/.rnstorybook/preview.tsx",
  "apps/mobile/.rnstorybook/stories/screens-routes/**/*.tsx",
  "apps/mobile/.rnstorybook/stories/screens-shell-routes/**/*.tsx",
  # build-image-editor.mjs imports this inside its generated esbuild entry source.
  "packages/client-runtime/src/images/image-editor-runtime.ts",
  # Documented brand tooling (assets/brand/README.md).
  "scripts/generate-app-icons.mjs",
  # Documented/child-process tools are executable roots, rather than importable APIs.
  "scripts/capture-site-screenshots.mjs",
  "scripts/generate-project-icon-choices.mjs",
  "scripts/retry-browser.mjs",
  # scripts/build-mcp-apps.mjs bundles these into the MCP app host and sandbox documents.
  "packages/studio-ui/mcp-apps/host.tsx",
  "packages/studio-ui/mcp-apps/sandbox.ts",
]
# React Native resolves these specifiers to the tracked @3x variants, and the macOS icon
# toolchain copies an Icon Composer bundle rather than importing a module.
ignoreUnresolvedImports = ["../../../assets/icons/*.png", "../../apps/desktop/build/Dovo.icon"]
# Security floor pins kept on purpose; the lockfile already resolves at or above them, so
# Fallow sees no rewritten version.
ignoreDependencyOverrides = [
  { package = "linkify-it" },
  { package = "uuid" },
  # pnpm represents this alias as h3 in the dependency graph; frozen install validates it.
  { package = "h3-v2", source = "pnpm-workspace.yaml" },
]
ignorePatterns = [
  "**/dist/**",
  "**/dist-electron/**",
  "**/node_modules/**",
  "**/.expo/**",
  "**/routeTree.gen.ts",
  "work/**",
]
# Expo resolves the app entry through its runtime manifest; keep this shared
# workspace package explicit even though Fallow cannot follow that edge yet.
# assistant-cloud is a required peer of @assistant-ui/core, reached through
# @assistant-ui/react-native even though Dovo does not import its cloud API.
# Expo's native Worklets adapters load Reanimated/Worklets through autolinking;
# explicit SDK-compatible pins prevent pnpm from choosing incompatible peers.
ignoreDependencies = [
  "@dovo/client-runtime",
  "vite-plus",
  "assistant-cloud",
  "react-native-reanimated",
  "react-native-worklets",
  # ExpoClipboard is loaded by requireOptionalNativeModule to retain OTA compatibility.
  "expo-clipboard",
  # expo-router's native tabs require this SDK-compatible autolinked peer.
  "expo-symbols",
  # Runtime PDF assets use import.meta.resolve (including the worker filename).
  "pdfjs-dist",
  # Theme catalog fixture uses createRequire(studio-core/package.json), where fflate
  # is declared; the script intentionally does not need a root dependency.
  "fflate",
  # Verification scripts use createRequire with the owning workspace's package.json.
  # These are declared there; they are not root package dependencies.
  "@storybook/addon-a11y",
  "react",
  "react-dom",
  "react-native-enriched-markdown",
  "sharp",
]

[[framework]]
name = "dovo-verification"
detection = { type = "fileExists", pattern = "scripts/verify-*.{cjs,mjs}" }
entryPoints = [
  "scripts/*.test.mjs",
  "scripts/verify-*.{cjs,mjs}",
  "scripts/packaging/verify-*.mjs",
  # Browser and benchmark checks are run as executables (package.json scripts or by hand).
  "scripts/check-*.mjs",
  "scripts/benchmark-*.mjs",
  # Started as child-process executables, never imported by the tests.
  "scripts/fixtures/*.cjs",
]
entryPointRole = "test"

[[framework]]
name = "dovo-ci"
detection = { type = "fileExists", pattern = ".github/actions/setup-build/action.yml" }
# CI packaging/upload helpers do not ship in the application runtime.
entryPoints = ["scripts/ci/*.mjs"]
entryPointRole = "support"

[[framework]]
name = "dovo-extension-views"
detection = { type = "fileExists", pattern = "packages/studio-core/src/index.ts" }
# defineStudioExtension loads these modules through `load: () => import(...)`; StudioShell
# consumes their default exports through React.lazy rather than a syntactic default import.
usedExports = [
  { pattern = "packages/extension-*/src/**/view.tsx", exports = [
    "default",
  ] },
  { pattern = "packages/extension-*/src/**/*-view.tsx", exports = [
    "default",
  ] },
  { pattern = "packages/extension-scm/src/connections/forge-settings.tsx", exports = [
    "default",
  ] },
  # Native ExtensionHost contributions read these dynamically loaded module.default exports.
  { pattern = "apps/mobile/src/screens/{tasks,artifacts,issues,pulls,repositories,settings}.tsx", exports = [
    "default",
  ] },
  # jira-view.tsx and pipelines-view.tsx re-export these as their lazy default exports.
  { pattern = "packages/extension-scm/src/work/work-view.tsx", exports = [
    "JiraView",
    "PipelinesView",
  ] },
  { pattern = "packages/studio-shell/src/app-settings/*.tsx", exports = [
    "default",
  ] },
  # These named exports are mounted by generated browser-check entry sources.
  { pattern = "packages/extension-agents/src/resources/view.tsx", exports = [
    "HookSettings",
  ] },
  { pattern = "packages/extension-runtime/src/remote-desktop-view.tsx", exports = [
    "RemoteDesktopViewer",
  ] },
  { pattern = "apps/mobile/src/tasks/creation/task-launcher-controls.tsx", exports = [
    "TaskLauncherControls",
  ] },
]

[[framework]]
name = "jsonrpc-transport"
enablers = ["vscode-jsonrpc"]
# vscode-jsonrpc invokes these abstract transport overrides through its own
# MessageReader/MessageWriter interfaces, outside this source graph.
usedClassMembers = [
  { extends = "AbstractMessageReader", members = [
    "listen",
  ] },
  { extends = "AbstractMessageWriter", members = [
    "write",
    "end",
  ] },
]

[[framework]]
name = "expo"
enablers = ["expo"]
entryPoints = ["apps/mobile/index.ts"]
configPatterns = [
  "apps/mobile/babel.config.cts",
  "apps/mobile/metro.config.ts",
  "apps/mobile/app.config.ts",
]
# expo-build-properties is loaded from the plugins array in app.config.ts.
toolingDependencies = ["@expo/metro-config", "babel-preset-expo", "expo-build-properties"]

[rules]
unused-files = "error"
unused-exports = "warn"
unused-types = "off"
# Enabled implicitly by the semantic pass; it reports exported signatures that mention
# unexported types, which is API-surface hygiene rather than dead code.
private-type-leaks = "off"

# Services are reached through the `Services` interface (`s.tasks.subagentSpawn`, HTTP route
# registrations); the semantic pass follows those typed accesses so class members used only
# that way are not reported as dead.
[typeAware]
enabled = true
