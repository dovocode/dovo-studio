appId: com.dovo.studio
---
- launchApp
- extendedWaitUntil:
    visible:
      id: Tab Settings
    timeout: 15000
- runFlow: reset-computers.yaml
- tapOn:
    id: Computer address
- inputText: ${RUNTIME_ADDRESS}
- pressKey: Enter
- scrollUntilVisible:
    element:
      id: Pairing options
    direction: DOWN
    centerElement: true
- tapOn:
    id: Pairing options
- scrollUntilVisible:
    element:
      id: This phone’s name
    direction: DOWN
    centerElement: true
- tapOn:
    id: This phone’s name
- eraseText
- inputText: Dovo simulator test
- pressKey: Enter
- scrollUntilVisible:
    element:
      id: Pairing code
    direction: DOWN
    centerElement: true
- tapOn:
    id: Pairing code
- inputText: ${PAIRING_CODE}
- tapOn:
    id: Dismiss keyboard
- scrollUntilVisible:
    element:
      id: Connect
    direction: DOWN
    centerElement: true
- tapOn:
    id: Connect
- extendedWaitUntil:
    visible:
      id: Connected computer
    timeout: 20000
- tapOn:
    id: Tab Tasks
- tapOn:
    id: Task mobile-task
- tapOn:
    id: Message
- inputText: Keep this draft while changing modes
- tapOn: Dismiss keyboard
- tapOn: Model & access
- extendedWaitUntil:
    notVisible: Loading provider models…
    timeout: 15000
- assertVisible: Provider default
- scrollUntilVisible:
    element:
      id: Speed
    direction: DOWN
    centerElement: true
- tapOn:
    id: Speed
- tapOn:
    id: Choose Fast
- scrollUntilVisible:
    element:
      id: Daybreak mode
    direction: DOWN
    centerElement: true
- tapOn:
    id: Daybreak mode
- tapOn:
    id: Choose Daybreak Blue
- takeScreenshot: dovo-mobile-codex-fast-daybreak
- scrollUntilVisible:
    element:
      id: Save model & access
    direction: DOWN
    centerElement: false
- tapOn:
    id: Save model & access
- extendedWaitUntil:
    visible:
      id: Message
    timeout: 10000
- tapOn: Model & access
- extendedWaitUntil:
    notVisible: Loading provider models…
    timeout: 15000
- scrollUntilVisible:
    element:
      id: Speed
    direction: DOWN
    centerElement: true
- assertVisible: Fast
- tapOn:
    id: Speed
- tapOn:
    id: Choose Standard
- scrollUntilVisible:
    element:
      id: Daybreak mode
    direction: DOWN
    centerElement: true
- assertVisible: Daybreak Blue
- tapOn:
    id: Daybreak mode
- tapOn:
    id: Choose Automatic
- scrollUntilVisible:
    element:
      id: Save model & access
    direction: DOWN
    centerElement: false
- tapOn:
    id: Save model & access
- extendedWaitUntil:
    visible:
      id: Message
    timeout: 10000
- tapOn: Model & access
- extendedWaitUntil:
    notVisible: Loading provider models…
    timeout: 15000
- scrollUntilVisible:
    element:
      id: Speed
    direction: DOWN
    centerElement: true
- assertVisible: Standard
- scrollUntilVisible:
    element:
      id: Daybreak mode
    direction: DOWN
    centerElement: true
- assertVisible: Automatic
- takeScreenshot: dovo-mobile-codex-standard-automatic
# A catalog with more than 12 models must search inside the settings sheet.
- scrollUntilVisible:
    element:
      id: Model
    direction: UP
    centerElement: true
- tapOn:
    id: Model
- assertVisible:
    id: Search model
- tapOn:
    id: Search model
- inputText: Daybreak Blue
- tapOn:
    id: Dismiss keyboard
- assertVisible:
    id: Choose Daybreak Blue
- assertNotVisible:
    id: Choose Fixture model
- takeScreenshot: dovo-mobile-codex-model-search
- tapOn:
    id: Choose Daybreak Blue
- assertNotVisible:
    id: Search model
- scrollUntilVisible:
    element:
      id: Save model & access
    direction: DOWN
    centerElement: false
- tapOn:
    id: Save model & access
- extendedWaitUntil:
    visible:
      id: Message
    timeout: 10000
- assertVisible:
    id: Message
    text: Keep this draft while changing modes
- tapOn: Model & access
- extendedWaitUntil:
    notVisible: Loading provider models…
    timeout: 15000
- assertVisible: Daybreak Blue
- scrollUntilVisible:
    element:
      id: Speed
    direction: DOWN
    centerElement: true
- assertVisible: Standard
- scrollUntilVisible:
    element:
      id: Daybreak mode
    direction: DOWN
    centerElement: true
- assertVisible: Automatic
# Closing with the inline picker expanded must dismiss the settings sheet itself.
- scrollUntilVisible:
    element:
      id: Model
    direction: UP
    centerElement: true
- tapOn:
    id: Model
- assertVisible:
    id: Search model
- tapOn:
    id: Close
- extendedWaitUntil:
    visible:
      id: Message
    timeout: 10000
- assertVisible:
    id: Message
    text: Keep this draft while changing modes
- tapOn: Model & access
- extendedWaitUntil:
    notVisible: Loading provider models…
    timeout: 15000
- scrollUntilVisible:
    element:
      id: Model
    direction: UP
    centerElement: true
- tapOn:
    id: Model
- tapOn:
    id: Choose Fixture model
- tapOn:
    id: Model
- tapOn:
    id: Choose Provider default
- scrollUntilVisible:
    element:
      id: Speed
    direction: DOWN
    centerElement: true
- assertVisible: Standard
- tapOn:
    id: Speed
- assertVisible:
    id: Choose Fast
- tapOn:
    id: Choose Standard
# Changing back to the provider default resets the speed override to null when saved.
- scrollUntilVisible:
    element:
      id: Model
    direction: UP
    centerElement: true
- tapOn:
    id: Model
- tapOn:
    id: Choose Fixture model
- tapOn:
    id: Model
- tapOn:
    id: Choose Provider default
- scrollUntilVisible:
    element:
      id: Save model & access
    direction: DOWN
    centerElement: false
- tapOn:
    id: Save model & access
- extendedWaitUntil:
    visible:
      id: Message
    timeout: 10000
- assertVisible:
    id: Message
    text: Keep this draft while changing modes
- tapOn: Back
- runFlow: reset-computers.yaml
