appId: com.dovo.studio
---
# Maestro measures these timeouts from the last interaction (Send), including
# earlier waits. Allow 60s for cold startup, 20s for output, then 30s to settle.
- extendedWaitUntil:
    visible: .*Working on this request.*
    timeout: 60000
- extendedWaitUntil:
    visible: .*Verified fixture response.*
    timeout: 80000
# Final output precedes checkpoint capture. Wait for the turn to settle before
# navigating or submitting the next prompt; neither run may pass on old output.
# The primary control changes from Stop to Send only after the turn settles.
- extendedWaitUntil:
    visible:
      id: Send
    timeout: 110000
