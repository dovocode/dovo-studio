# Run only on a disposable emulator. This flow clears the installed app's data.
appId: com.dovo.studio
---
- launchApp:
    clearState: true
- extendedWaitUntil:
    visible: Connect a computer
    timeout: 20000
- evalScript: ${output.pairing = json(http.post(PAIRING_CONTROL_ADDRESS + '/pairing-code', {body:'{}'}).body)}
- openLink: "${'dovo://pair?address=' + encodeURIComponent(RUNTIME_ADDRESS) + '&code=' + output.pairing.code + '&expiresAt=' + encodeURIComponent(output.pairing.expiresAt)}"
- extendedWaitUntil:
    visible:
      id: Pairing options
    timeout: 15000
- tapOn:
    id: Pairing options
- scrollUntilVisible:
    element:
      id: This phone’s name
    direction: DOWN
- tapOn:
    id: This phone’s name
- eraseText
- inputText: Dovo Android test
- assertVisible:
    id: This phone’s name
    text: Dovo Android test
- hideKeyboard
- scrollUntilVisible:
    element:
      id: Connect
    direction: UP
- tapOn:
    id: Connect
- extendedWaitUntil:
    visible:
      id: Task mobile-task
    timeout: 30000
- openLink: ${THREAD_LINK}
- extendedWaitUntil:
    visible: Review this change from your phone.
    timeout: 20000
- openLink: dovo://thread?runtimeId=unpaired-computer&threadId=mobile-task
- extendedWaitUntil:
    visible: This thread’s computer is no longer paired.
    timeout: 10000
- tapOn: Go to threads
- openLink: ${THREAD_LINK}
- extendedWaitUntil:
    visible:
      id: Message
    timeout: 15000
- evalScript: ${output.offline = http.post(PAIRING_CONTROL_ADDRESS + '/offline', {body:'{}'}).status}
- assertTrue: ${output.offline == 200}
- tapOn:
    id: Message
- inputText: Android recovery draft
- hideKeyboard
- assertVisible:
    id: Message
    text: Android recovery draft
- extendedWaitUntil:
    visible:
      id: Send when online
    timeout: 20000
- pressKey: Home
- stopApp
- openLink: ${THREAD_LINK}
- extendedWaitUntil:
    visible:
      id: Message
      text: Android recovery draft
    timeout: 30000
- assertVisible:
    id: Send when online
- evalScript: ${output.online = http.post(PAIRING_CONTROL_ADDRESS + '/online', {body:'{}'}).status}
- assertTrue: ${output.online == 200}
- extendedWaitUntil:
    visible:
      id: Send
    timeout: 90000
- tapOn:
    id: Send
- runFlow: fixture-response.yaml
