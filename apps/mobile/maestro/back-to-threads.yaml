appId: com.dovo.studio
---
# UIKit's icon-only back button does not consistently expose a text label on iOS 26.
# Exercise the supported native pop gesture and verify the destination explicitly.
- swipe:
    start: 1%, 50%
    end: 90%, 50%
    duration: 500
- extendedWaitUntil:
    visible:
      id: Task mobile-task
    timeout: 10000
