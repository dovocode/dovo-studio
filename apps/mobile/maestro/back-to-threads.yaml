appId: com.dovo.studio
---
# UIKit exposes BackButton even when its icon-only button has no text label.
# Target that control instead of relying on a coordinate swipe in the release smoke.
# navigation.yaml retains the native pop-gesture checks.
- waitForAnimationToEnd:
    timeout: 10000
- tapOn:
    id: BackButton
- extendedWaitUntil:
    visible:
      id: Task mobile-task
    timeout: 10000
