appId: com.dovo.studio
---
- launchApp
- extendedWaitUntil:
    visible:
      id: Tab Settings
    timeout: 15000
- runFlow: reset-computers.yaml
- tapOn:
    id: Runtime address
- inputText: ${RUNTIME_ADDRESS}
- pressKey: Enter
- scrollUntilVisible:
    element:
      id: Pairing options
    direction: DOWN
    centerElement: true
- tapOn:
    id: Pairing options
- scrollUntilVisible:
    element:
      id: Device name
    direction: DOWN
    centerElement: true
- tapOn:
    id: Device name
- eraseText
- inputText: Dovo simulator test
- pressKey: Enter
- scrollUntilVisible:
    element:
      id: Pairing code
    direction: DOWN
    centerElement: true
- tapOn:
    id: Pairing code
- inputText: ${PAIRING_CODE}
- tapOn:
    id: Dismiss keyboard
- scrollUntilVisible:
    element:
      id: Pair device
    direction: DOWN
    centerElement: true
- tapOn:
    id: Pair device
- extendedWaitUntil:
    visible:
      id: Connected computer
    timeout: 20000
- tapOn:
    id: Tab Tasks
- assertVisible: '.*build-mac.*'
- tapOn:
    id: Task markdown-task
- assertVisible: '.*Mobile fixture.*build-mac.*'
- assertVisible: Inline code
- assertVisible: '.*pnpm test.*'
- assertVisible: '.*RemoteRuntimeConnectionCheckpointRestorationStrategy.*'
- assertVisible: '.*src/runtime.ts.*'
- assertNotVisible: '.*`pnpm test`.*'
- assertNotVisible: '.*`draft.text`.*'
- waitForAnimationToEnd
- takeScreenshot: dovo-mobile-inline-standard
