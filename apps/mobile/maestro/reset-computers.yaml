appId: com.dovo.studio
---
- runFlow: open-devices.yaml
- repeat:
    while:
      visible:
        id: 'Computer .+|Connected computer'
    commands:
      - tapOn:
          id: 'Computer .+|Connected computer'
          index: 0
      - scrollUntilVisible:
          element:
            id: Forget computer
          direction: DOWN
          centerElement: true
      - tapOn: Forget computer
      - tapOn:
          text: Forget

- tapOn:
    id: Connect a computer
