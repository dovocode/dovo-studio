appId: com.dovo.studio
---
- runFlow: open-settings.yaml
- tapOn:
    id: Search settings
- inputText: computer
- pressKey: Enter
- scrollUntilVisible:
    element:
      id: Devices & runtime
    direction: DOWN
- tapOn:
    id: Devices & runtime

- extendedWaitUntil:
    visible:
      text: Computers
    timeout: 10000
