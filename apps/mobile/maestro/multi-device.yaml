appId: com.dovo.studio
---
- runFlow: open-devices.yaml
- tapOn: Add computer
- tapOn:
    id: Computer address
- inputText: ${SECOND_ADDRESS}
- pressKey: Enter
- scrollUntilVisible:
    element:
      id: Pairing options
    direction: DOWN
    centerElement: true
- tapOn:
    id: Pairing options
- scrollUntilVisible:
    element:
      id: Computer name
    direction: DOWN
    centerElement: true
- tapOn:
    id: Computer name
- inputText: Second Mac
- pressKey: Enter
- scrollUntilVisible:
    element:
      id: This phone’s name
    direction: DOWN
    centerElement: true
- tapOn:
    id: This phone’s name
- eraseText
- inputText: Dovo multi-device test
- pressKey: Enter
- scrollUntilVisible:
    element:
      id: Pairing code
    direction: DOWN
    centerElement: true
- tapOn:
    id: Pairing code
- inputText: ${SECOND_CODE}
- tapOn:
    id: Dismiss keyboard
- scrollUntilVisible:
    element:
      id: Connect
    direction: DOWN
    centerElement: true
- tapOn:
    id: Connect
- extendedWaitUntil:
    visible: Manage First Mac
    timeout: 20000
- tapOn:
    id: Tab Tasks
- assertVisible:
    id: Device overview
- takeScreenshot: dovo-mobile-computers
- scrollUntilVisible:
    element:
      text: '.*Second host task.*'
    direction: DOWN
- tapOn: '.*Second host task.*'
- assertNotVisible: Draft for first computer
- tapOn:
    id: Message
- inputText: Work only on the second computer
- tapOn: Dismiss keyboard
- tapOn:
    id: Send
- extendedWaitUntil:
    visible: '.*Verified fixture response.*'
    timeout: 20000
- tapOn: Back
- scrollUntilVisible:
    element:
      id: Search tasks
    direction: UP
    centerElement: true
- tapOn:
    id: Search tasks
- inputText: host task
- pressKey: Enter
- tapOn:
    id: Task filters and sorting
- tapOn:
    id: Task filter
- tapOn:
    id: Choose Settled
- tapOn: Done
- tapOn:
    id: Task filters and sorting
- tapOn:
    id: Thread sort
- tapOn:
    id: Choose Title A–Z
- tapOn: Done
- tapOn:
    id: Device overview
- tapOn:
    id: Runtime summary ${FIRST_ADDRESS}
- tapOn: View tasks on this device
- scrollUntilVisible:
    element:
      text: '.*First host task.*'
    direction: DOWN
# XCTest exposes full row frames even when clipped by the tab-safe list viewport.
# Finish scrolling to the actual end before tapping the last row; do not center it.
- swipe:
    start: 50%, 70%
    end: 50%, 30%
    duration: 500
- waitForAnimationToEnd
- takeScreenshot: dovo-mobile-task-list-bottom
- tapOn: '.*First host task.*'
- assertVisible: Draft for first computer
- assertNotVisible: Work only on the second computer
- takeScreenshot: dovo-mobile-scoped-draft
- tapOn: Back
# Opening a lower task on another runtime must return to the same list position.
- assertVisible: '.*First host task.*'
- assertNotVisible:
    id: Search tasks
- takeScreenshot: dovo-mobile-retained-task-position
- scrollUntilVisible:
    element:
      id: Search tasks
    direction: UP
    centerElement: true
- assertVisible:
    id: Search tasks
    text: host task
- assertVisible: 'Settled · Title A–Z'
- assertVisible: '.*First Mac.*'
- takeScreenshot: dovo-mobile-retained-task-filters
- runFlow: open-devices.yaml
- assertVisible: Manage First Mac
- assertVisible: Manage Second Mac
- stopApp
- launchApp
- extendedWaitUntil:
    visible:
      id: Tab Settings
    timeout: 20000
- runFlow: open-devices.yaml
- extendedWaitUntil:
    visible: Manage First Mac
    timeout: 20000
- tapOn:
    id: Tab Tasks
- assertVisible:
    id: Device overview
- tapOn:
    id: Task filters and sorting
- tapOn:
    id: Task filter
- tapOn:
    id: Choose Settled
- tapOn: Done
- scrollUntilVisible:
    element:
      text: '.*First host task.*'
    direction: DOWN
- swipe:
    start: 50%, 70%
    end: 50%, 30%
    duration: 500
- waitForAnimationToEnd
- tapOn: '.*First host task.*'
- assertVisible: Draft for first computer
- tapOn: Back
- runFlow: reset-computers.yaml
