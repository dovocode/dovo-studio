appId: com.dovo.studio
---
- launchApp
- extendedWaitUntil:
    visible:
      id: Tab Settings
    timeout: 20000
- runFlow: reset-computers.yaml
- tapOn:
    id: Runtime address
- inputText: ${FIRST_ADDRESS}
- pressKey: Enter
- scrollUntilVisible:
    element:
      id: Pairing options
    direction: DOWN
    centerElement: true
- tapOn:
    id: Pairing options
- scrollUntilVisible:
    element:
      id: Computer name
    direction: DOWN
    centerElement: true
- tapOn:
    id: Computer name
- inputText: First Mac
- pressKey: Enter
- scrollUntilVisible:
    element:
      id: Device name
    direction: DOWN
    centerElement: true
- tapOn:
    id: Device name
- eraseText
- inputText: Dovo multi-device test
- pressKey: Enter
- scrollUntilVisible:
    element:
      id: Pairing code
    direction: DOWN
    centerElement: true
- tapOn:
    id: Pairing code
- inputText: ${FIRST_CODE}
- tapOn:
    id: Dismiss keyboard
- scrollUntilVisible:
    element:
      id: Pair device
    direction: DOWN
    centerElement: true
- tapOn:
    id: Pair device
- extendedWaitUntil:
    visible:
      id: Connected computer
    timeout: 20000
- tapOn:
    id: Tab Tasks
- scrollUntilVisible:
    element:
      text: '.*First host task.*'
    direction: DOWN
- tapOn: '.*First host task.*'
- tapOn:
    id: Message
- inputText: Draft for first computer
- tapOn: Dismiss keyboard
- tapOn: Back
