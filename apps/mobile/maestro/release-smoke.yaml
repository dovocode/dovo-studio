# scripts/ci/mobile-native-smoke.mjs supplies a fresh disposable simulator, never a user's phone.
appId: com.dovo.studio
---
- launchApp
- extendedWaitUntil:
    visible: Connect a computer
    timeout: 15000
- tapOn: Connect a computer
- waitForAnimationToEnd:
    timeout: 10000
- tapOn:
    id: Computer address
- inputText: ${RUNTIME_ADDRESS}
- pressKey: Enter
- scrollUntilVisible:
    element:
      id: Pairing options
    direction: DOWN
- tapOn:
    id: Pairing options
- scrollUntilVisible:
    element:
      id: This phone’s name
    direction: DOWN
- tapOn:
    id: This phone’s name
- eraseText
- inputText: Dovo simulator test
- assertVisible:
    id: This phone’s name
    text: Dovo simulator test
- pressKey: Enter
- scrollUntilVisible:
    element:
      id: Pairing code
    direction: UP
- tapOn:
    id: Pairing code
- inputText: ${PAIRING_CODE}
- tapOn: Dismiss keyboard
- scrollUntilVisible:
    element:
      id: Connect
    direction: DOWN
- tapOn:
    id: Connect
# Hosted simulators can take more than 20 seconds to claim, save and load the first snapshot.
- extendedWaitUntil:
    visible:
      id: Task mobile-task
    timeout: 60000
- openLink: ${THREAD_LINK}
- tapOn:
    text: Open
    optional: true
- extendedWaitUntil:
    visible: Review this change from your phone.
    timeout: 20000
- tapOn:
    id: Message
- inputText: Installed app smoke request
- tapOn: Dismiss keyboard
# The keyboard moves Send; wait before Maestro resolves its tap coordinates.
- waitForAnimationToEnd:
    timeout: 10000
- tapOn:
    id: Send
- runFlow: fixture-response.yaml
# Recalled text must survive the send lock and the asynchronous native snapshot.
- tapOn:
    id: Add to draft
- tapOn: Message history
- extendedWaitUntil:
    visible:
      id: Composer history browser
    timeout: 10000
- assertVisible:
    id: Message
    text: Installed app smoke request
- tapOn:
    id: Send
- runFlow: fixture-response.yaml
- tapOn:
    id: Message
- inputText: Draft survives navigation
- tapOn: Dismiss keyboard
- runFlow: back-to-threads.yaml
- tapOn:
    id: Task mobile-task
- assertVisible:
    id: Message
    text: Draft survives navigation
- evalScript: ${output.offline = http.post(PAIRING_CONTROL_ADDRESS + '/offline', {body:'{}'}).status}
- assertTrue: ${output.offline == 200}
- extendedWaitUntil:
    visible:
      id: Send when online
    timeout: 20000
- tapOn:
    id: Message
- eraseText
- inputText: iOS recovery draft
- tapOn: Dismiss keyboard
- assertVisible:
    id: Message
    text: iOS recovery draft
- stopApp
- openLink: ${THREAD_LINK}
- tapOn:
    text: Open
    optional: true
- extendedWaitUntil:
    visible:
      id: Message
      text: iOS recovery draft
    timeout: 30000
- assertVisible:
    id: Send when online
- evalScript: ${output.online = http.post(PAIRING_CONTROL_ADDRESS + '/online', {body:'{}'}).status}
- assertTrue: ${output.online == 200}
- extendedWaitUntil:
    visible:
      id: Send
    timeout: 90000
- tapOn:
    id: Send
- runFlow: fixture-response.yaml
- runFlow: back-to-threads.yaml
- tapOn: New thread
- extendedWaitUntil:
    visible:
      id: Message
    timeout: 10000
- tapOn:
    id: Message
- inputText: Installed app first send
- tapOn: Dismiss keyboard
- waitForAnimationToEnd:
    timeout: 10000
- tapOn:
    id: Send
- runFlow: fixture-response.yaml
- runFlow: back-to-threads.yaml
- tapOn: More actions
- tapOn: Settings
# Wait for the destination and find the row through search, independently of
# the initial scroll position and native navigation transition.
- extendedWaitUntil:
    visible:
      id: Search settings
    timeout: 10000
- tapOn:
    id: Search settings
- inputText: App & updates
- pressKey: Enter
- extendedWaitUntil:
    visible:
      id: App & updates
    timeout: 10000
- tapOn:
    id: App & updates
- assertVisible: Open TestFlight
- assertVisible: Release notes channel
- takeScreenshot: dovo-installed-native-release-smoke
