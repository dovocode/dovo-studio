appId: com.dovo.studio
---
- launchApp
- extendedWaitUntil:
    visible:
      id: Tab More
    timeout: 15000
- runFlow: reset-computers.yaml
- tapOn:
    id: Computer address
- inputText: ${RUNTIME_ADDRESS}
- pressKey: Enter
- scrollUntilVisible:
    element:
      id: Pairing options
    direction: DOWN
    centerElement: true
- tapOn:
    id: Pairing options
- scrollUntilVisible:
    element:
      id: This phone’s name
    direction: DOWN
    centerElement: true
- tapOn:
    id: This phone’s name
- eraseText
- inputText: Dovo simulator test
- pressKey: Enter
- scrollUntilVisible:
    element:
      id: Pairing code
    direction: DOWN
    centerElement: true
- tapOn:
    id: Pairing code
- inputText: ${PAIRING_CODE}
- tapOn:
    id: Dismiss keyboard
- scrollUntilVisible:
    element:
      id: Connect
    direction: DOWN
    centerElement: true
- tapOn:
    id: Connect
- extendedWaitUntil:
    visible:
      id: Connected computer
    timeout: 20000
- tapOn:
    id: Tab Tasks
- tapOn:
    id: Task mobile-task
- tapOn: Terminal
- tapOn: New terminal
- extendedWaitUntil:
    notVisible: 'Loading terminal…|Connecting terminal…'
    timeout: 15000
# Tapping the native Ghostty surface focuses it and raises the keyboard.
- tapOn:
    id: Terminal surface
- assertVisible: Hide terminal keyboard
- assertVisible: '(space|spatie)'
- assertVisible: Esc
- assertVisible: Tab
- assertVisible: Shift
- assertVisible: Ctrl
- assertVisible: Alt
- tapOn: Hide terminal keyboard
- assertVisible: Show terminal keyboard
- tapOn: Show terminal keyboard
- assertVisible: Hide terminal keyboard
- assertVisible: '(space|spatie)'
# Cancel a composed word before running the proof command. If Ctrl is ignored,
# the invalid command prefix prevents the proof file from being created.
- inputText: terminal-input-should-cancel
- tapOn: Ctrl
- inputText: c
- inputText: printf mobile-terminal-ok > terminal-proof.txt
- pressKey: Enter
- takeScreenshot: dovo-mobile-terminal-keyboard
- tapOn: Task tools
- tapOn: Chat
- tapOn: Terminal
- assertVisible: Close terminal tab 1
- tapOn: Close terminal tab 1
- tapOn: Close terminal
- tapOn: Back
- runFlow: reset-computers.yaml
