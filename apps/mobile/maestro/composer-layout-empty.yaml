appId: com.dovo.studio
---
- launchApp
- extendedWaitUntil:
    visible:
      id: Tab Settings
    timeout: 15000
- runFlow: reset-computers.yaml
- tapOn:
    id: Computer address
- inputText: ${RUNTIME_ADDRESS}
- pressKey: Enter
- scrollUntilVisible:
    element:
      id: Pairing options
    direction: DOWN
    centerElement: true
- tapOn:
    id: Pairing options
- scrollUntilVisible:
    element:
      id: This phone’s name
    direction: DOWN
    centerElement: true
- tapOn:
    id: This phone’s name
- eraseText
- inputText: Dovo simulator test
- pressKey: Enter
- scrollUntilVisible:
    element:
      id: Pairing code
    direction: DOWN
    centerElement: true
- tapOn:
    id: Pairing code
- inputText: ${PAIRING_CODE}
- tapOn:
    id: Dismiss keyboard
- scrollUntilVisible:
    element:
      id: Connect
    direction: DOWN
    centerElement: true
- tapOn:
    id: Connect
- extendedWaitUntil:
    visible:
      id: Connected computer
    timeout: 20000
- tapOn:
    id: Tab Tasks
- tapOn:
    text: New task
- extendedWaitUntil:
    visible:
      id: Project & checkout
    timeout: 10000
- assertVisible: What are we building?
- tapOn:
    id: Message
- waitForAnimationToEnd
- assertVisible:
    id: Dismiss keyboard
    width: 44
    height: 44
    tolerance: 1
- assertVisible:
    id: Attach files
    width: 44
    height: 44
    tolerance: 1
- assertVisible:
    id: Dictate message
    width: 44
    height: 44
    tolerance: 1
- assertVisible:
    id: Send
    width: 44
    height: 44
    tolerance: 1
- assertVisible: Model & access
- assertVisible:
    id: Project & checkout
- takeScreenshot: dovo-mobile-new-draft-keyboard-empty
