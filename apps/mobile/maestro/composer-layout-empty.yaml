appId: com.dovo.studio
---
- launchApp:
    stopApp: true
- extendedWaitUntil:
    visible:
      text: More actions
    timeout: 15000
- runFlow: reset-computers.yaml
- tapOn:
    id: Computer address
- inputText: ${RUNTIME_ADDRESS}
- pressKey: Enter
- scrollUntilVisible:
    element:
      id: Pairing options
    direction: DOWN
    centerElement: true
- tapOn:
    id: Pairing options
- scrollUntilVisible:
    element:
      id: This phone’s name
    direction: DOWN
    centerElement: true
- tapOn:
    id: This phone’s name
- eraseText
- inputText: Dovo simulator test
- pressKey: Enter
- scrollUntilVisible:
    element:
      id: Pairing code
    direction: DOWN
    centerElement: true
- tapOn:
    id: Pairing code
- inputText: ${PAIRING_CODE}
- tapOn:
    id: Dismiss keyboard
- scrollUntilVisible:
    element:
      id: Connect
    direction: DOWN
    centerElement: true
- tapOn:
    id: Connect
- extendedWaitUntil:
    visible:
      id: Connected computer
    timeout: 20000
- tapOn:
    id: Tab Tasks
- tapOn:
    text: New thread
- extendedWaitUntil:
    visible:
      id: Message
    timeout: 10000
- tapOn: Choose project
- tapOn: Mobile fixture
- tapOn: Advanced
- assertVisible: What would you like to work on?
- tapOn:
    id: Message
- waitForAnimationToEnd
- extendedWaitUntil:
    visible:
      id: Checkout & branch
    timeout: 10000
- assertVisible:
    id: Dismiss keyboard
    width: 44
    height: 44
    tolerance: 1
- assertVisible:
    id: Add to draft
    width: 44
    height: 44
    tolerance: 1
- assertVisible:
    id: Dictate message
    width: 44
    height: 44
    tolerance: 1
- assertVisible:
    id: Send
    width: 44
    height: 44
    tolerance: 1
- assertVisible: Agent & model
- assertVisible:
    id: Checkout & branch
- takeScreenshot: dovo-mobile-new-draft-keyboard-empty
