appId: com.dovo.studio
---
- launchApp
- extendedWaitUntil:
    visible:
      id: Tab Settings
    timeout: 15000
- runFlow: reset-computers.yaml
- tapOn:
    id: Runtime address
- inputText: ${RUNTIME_ADDRESS}
- pressKey: Enter
- scrollUntilVisible:
    element:
      id: Pairing options
    direction: DOWN
    centerElement: true
- tapOn:
    id: Pairing options
- scrollUntilVisible:
    element:
      id: Device name
    direction: DOWN
    centerElement: true
- tapOn:
    id: Device name
- eraseText
- inputText: Dovo simulator test
- pressKey: Enter
- scrollUntilVisible:
    element:
      id: Pairing code
    direction: DOWN
    centerElement: true
- tapOn:
    id: Pairing code
- inputText: ${PAIRING_CODE}
- tapOn:
    id: Dismiss keyboard
- scrollUntilVisible:
    element:
      id: Pair device
    direction: DOWN
    centerElement: true
- tapOn:
    id: Pair device
- extendedWaitUntil:
    visible:
      id: Connected computer
    timeout: 20000
- tapOn:
    id: Tab Tasks
- tapOn:
    id: Task mobile-task
- assertVisible: Review this change from your phone.
- tapOn:
    id: Message
- inputText: Checkpoint verification
- tapOn: Dismiss keyboard
- tapOn:
    id: Send
- extendedWaitUntil:
    visible: '.*Verified fixture response.*'
    timeout: 20000
- tapOn: Ran 1 command
- scrollUntilVisible:
    element:
      text: 'git status --short'
    direction: DOWN
- tapOn: 'git status --short'
- assertVisible: '.*Fixture worktree is clean.*'
- takeScreenshot: dovo-assistant-tool-output
- tapOn: 'git status --short'
- scrollUntilVisible:
    element:
      id: Turn changes · 1 file
    direction: DOWN
- tapOn:
    id: Turn changes · 1 file
- assertVisible: Snapshot diff for this turn. Select Current changes to edit files.
- assertVisible: '.*checkpoint-fixture.txt.*'
- takeScreenshot: dovo-assistant-checkpoint
- tapOn: Task tools
- tapOn: Chat
- assertVisible: '.*Verified fixture response.*'
- tapOn: Back
- runFlow: reset-computers.yaml
