# Keep the environment file and persistent data outside the GitHub checkout.
services:
  artifacts:
    build:
      context: ../..
      dockerfile: apps/artifact-server/Dockerfile
    restart: unless-stopped
    init: true
    user: '1000:1000'
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    tmpfs: ['/tmp:rw,noexec,nosuid,size=32m,mode=1777']
    env_file: [/etc/dokploy/secrets/dovo-artifacts/artifacts.env]
    expose: ['8080']
    volumes: [artifact-data:/data]
    networks: [default, dokploy-network]
volumes:
  artifact-data:
    name: dovo-artifacts-data
networks:
  dokploy-network:
    external: true
