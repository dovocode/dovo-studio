services:
  connect:
    build:
      context: ../..
      dockerfile: apps/connect-server/Dockerfile
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp
    environment:
      PORT: '8080'
      DOVO_CONNECT_ORIGIN: ${DOVO_CONNECT_ORIGIN:-https://connect.dovo.studio}
      DOVO_CONNECT_TRUSTED_PROXIES: ${DOVO_CONNECT_TRUSTED_PROXIES:-}
      DOVO_AUTH_ISSUER: ${DOVO_AUTH_ISSUER:-}
      DOVO_AUTH_CONNECT_CLIENT_ID: ${DOVO_AUTH_CONNECT_CLIENT_ID:-dovo-connect}
      DOVO_AUTH_CONNECT_CLIENT_SECRET: ${DOVO_AUTH_CONNECT_CLIENT_SECRET:-}
      DOVO_AUTH_SERVICE_KEY: ${DOVO_AUTH_SERVICE_KEY:-}
      DOVO_CONNECT_DATA: /data/private
      DOVO_NOTIFICATION_RELAY_URL: ${DOVO_NOTIFICATION_RELAY_URL:-}
      DOVO_NOTIFICATION_RELAY_TOKEN: ${DOVO_NOTIFICATION_RELAY_TOKEN:-}
      DOVO_TURN_HOURLY_LIMIT: ${DOVO_TURN_HOURLY_LIMIT:-100}
      DOVO_RELAY_TURN_URLS: ${DOVO_RELAY_TURN_URLS:-}
      DOVO_RELAY_TURN_SECRET: ${DOVO_RELAY_TURN_SECRET:-}
      DOVO_RELAY_APPROVED_KEYS: ${DOVO_RELAY_APPROVED_KEYS:-}
    volumes:
      - accounts:/data
    ports:
      - '127.0.0.1:8081:8080'
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
volumes:
  accounts:
