# Set public/private addresses explicitly when this operator host is behind NAT:
# listening-ip=10.0.0.2
# relay-ip=10.0.0.2
# external-ip=PUBLIC_IP/10.0.0.2
listening-port=3478
# TLS port comes from DOVO_TURN_TLS_PORT in compose (default 443).
min-port=20000
max-port=20099
realm=turn.dovo.studio
server-name=turn.dovo.studio
use-auth-secret
fingerprint
cert=/etc/coturn/certs/fullchain.pem
pkey=/etc/coturn/certs/privkey.pem
no-tlsv1
no-tlsv1_1
no-dtls
no-cli
no-tcp-relay
no-multicast-peers
no-software-attribute
# Dedicated TURN service; public STUN discovery uses the app's separate STUN servers.
no-stun
no-rfc5780
max-allocate-lifetime=600
user-quota=8
total-quota=1000
# Bytes/sec: 10 Mbps per allocation and 500 Mbps capacity, each direction separately.
# Coturn reserves max-bps per allocation even while idle: this permits 50 allocations.
max-bps=1250000
bps-capacity=62500000
stale-nonce=600
denied-peer-ip=0.0.0.0-0.255.255.255
denied-peer-ip=10.0.0.0-10.255.255.255
denied-peer-ip=100.64.0.0-100.127.255.255
denied-peer-ip=127.0.0.0-127.255.255.255
denied-peer-ip=169.254.0.0-169.254.255.255
denied-peer-ip=172.16.0.0-172.31.255.255
denied-peer-ip=192.168.0.0-192.168.255.255
denied-peer-ip=198.18.0.0-198.19.255.255
denied-peer-ip=224.0.0.0-255.255.255.255
denied-peer-ip=::1
denied-peer-ip=::ffff:0:0-::ffff:ffff:ffff
denied-peer-ip=64:ff9b::-64:ff9b::ffff:ffff
denied-peer-ip=fc00::-fdff:ffff:ffff:ffff:ffff:ffff:ffff:ffff
denied-peer-ip=fe80::-febf:ffff:ffff:ffff:ffff:ffff:ffff:ffff
pidfile=/tmp/dovo-turn.pid
log-file=stdout
simple-log
