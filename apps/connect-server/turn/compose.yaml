# Operator-only Linux service with dedicated ports and a public IP. TURN is not an HTTP
# service: bypass HTTP/CDN proxies and allow its TCP/UDP ports in the firewall.
services:
  budget:
    build: ./budget
    restart: unless-stopped
    network_mode: host
    read_only: true
    environment:
      DOVO_TURN_TLS_PORT: ${DOVO_TURN_TLS_PORT:-443}
      DOVO_TURN_PUBLIC_IPS: ${DOVO_TURN_PUBLIC_IPS:-}
    volumes:
      - budget:/budget
    cap_drop:
      - ALL
    cap_add:
      - NET_ADMIN
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test:
        [
          'CMD',
          'python3',
          '-c',
          'import os; from pathlib import Path; from guard import readiness; assert Path("/budget/ready").read_text() == readiness(int(os.environ.get("DOVO_TURN_TLS_PORT", "443")))',
        ]
      interval: 5s
      timeout: 3s
      retries: 3
      start_period: 10s
  turn:
    image: coturn/coturn:4.6.3
    restart: unless-stopped
    network_mode: host
    read_only: true
    tmpfs:
      - /tmp
    depends_on:
      budget:
        condition: service_healthy
    environment:
      DOVO_RELAY_TURN_SECRET: ${DOVO_RELAY_TURN_SECRET:?Set the same private secret on Connect and coturn}
      DOVO_TURN_TLS_PORT: ${DOVO_TURN_TLS_PORT:-443}
      DOVO_TURN_PUBLIC_IPS: ${DOVO_TURN_PUBLIC_IPS:-}
    entrypoint: ['/bin/sh', '-ec']
    command:
      - |
        # Docker restart policies do not honor depends_on after a host reboot.
        # Wait for this boot's quota rules even when Docker starts coturn first.
        expected="$$(cat /proc/sys/kernel/random/boot_id):$$DOVO_TURN_TLS_PORT:security-v5-daily:$$DOVO_TURN_PUBLIC_IPS"
        until [ "$$(cat /budget/ready 2>/dev/null)" = "$$expected" ]; do sleep 1; done
        umask 077
        cp /etc/coturn/dovo.conf /tmp/dovo-turn.conf
        printf '\nstatic-auth-secret=%s\n' "$$DOVO_RELAY_TURN_SECRET" >> /tmp/dovo-turn.conf
        printf '\ntls-listening-port=%s\n' "$$DOVO_TURN_TLS_PORT" >> /tmp/dovo-turn.conf
        exec turnserver -c /tmp/dovo-turn.conf
    volumes:
      - budget:/budget:ro
      - ./turnserver.conf:/etc/coturn/dovo.conf:ro
      - ./certs:/etc/coturn/certs:ro
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    security_opt:
      - no-new-privileges:true
volumes:
  budget:
