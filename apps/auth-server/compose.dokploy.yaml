# Deploy separately from Connect. Configure auth.dovo.studio -> auth:8080 in Dokploy.
services:
  auth:
    build:
      context: ../..
      dockerfile: apps/auth-server/Dockerfile
    restart: unless-stopped
    init: true
    user: '1000:1000'
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    env_file:
      - /etc/dokploy/secrets/dovo-studio-auth/auth.env
    volumes:
      - auth-data:/data
    expose:
      - '8080'
    networks:
      - dokploy-network
volumes:
  auth-data:
    name: dovo-studio-auth-data
networks:
  dokploy-network:
    external: true
